[build]
  command = "npm run build"
  publish = "dist"
[build.environment]
  NODE_VERSION = "24"
[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  framework = "vite"
# ComfyUI API/media go directly to the PC in-browser. Only encrypted sync/pairing use Netlify Functions.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
# Sync handlers are retained in server/paused-sync, outside function discovery.
# Serve a static error to old tabs without invoking any serverless function.
[[redirects]]
  from = "/.netlify/functions/device-sync"
  to = "/device-sync-off.json"
  status = 404
  force = true
[[redirects]]
  from = "/.netlify/functions/device-pairing"
  to = "/device-sync-off.json"
  status = 404
  force = true
[[redirects]]
  from = "/local"
  to = "/"
  status = 301
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Always revalidate the entry HTML when a new version is deployed.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
